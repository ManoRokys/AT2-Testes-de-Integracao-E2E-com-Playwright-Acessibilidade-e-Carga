[project]
name = "at2-testes-de-integracao-e2e-com-playwright-acessibilidade-e-carga"
version = "0.1.0"
description = "AutoCar - Sistema de Agendamento e Revisão Automotiva com Testes de Integração, E2E Playwright, Acessibilidade e Carga"
readme = "README.md"
authors = [
    { name = "Lucas Gomes Fagundes", email = "fagundesluca77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.6",
    "faker>=25.0.0",
    "locust>=2.29.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-playwright>=0.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: Testes de integração de rotas com TestClient, Fixtures e Mocks",
    "e2e: Testes End-to-End com Playwright e Page Object Model",
    "accessibility: Auditoria de acessibilidade WCAG 2.1 AA com Axe-core e teclado"
]
addopts = "-v --strict-markers"
